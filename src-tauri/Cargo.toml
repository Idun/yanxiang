[package]
name = "docintel-app"
version = "0.1.0"
description = "YanXiang agent desktop Markdown workbench"
authors = ["YanXiang agent"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "docintel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
